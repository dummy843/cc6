<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEED Interdisciplinary Matching Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFD9;--ink:#2F4A2C;--line:#1C2B1A;--leaf:#7FAF7A;--peach:#EFB894;--card:#F8F9EC;--muted:#5E7359;--eng:#E0A33A;--bus:#5B8FB9;--hum:#7FAF7A;--ontxt:#1C2B1A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#182218;--ink:#DDE8D3;--line:#0B120B;--leaf:#6FA06A;--peach:#B8825F;--card:#223022;--muted:#9DB394;--ontxt:#101810}}
:root[data-theme="dark"]{--bg:#182218;--ink:#DDE8D3;--line:#0B120B;--leaf:#6FA06A;--peach:#B8825F;--card:#223022;--muted:#9DB394;--ontxt:#101810}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 48px}
h1{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1;margin:0;color:var(--leaf);-webkit-text-stroke:2px var(--line);paint-order:stroke fill;letter-spacing:.5px}
h2{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:24px;margin:0 0 10px}
.sub{display:inline-block;margin-top:14px;padding:8px 16px;background:var(--peach);color:var(--ontxt);border:2px solid var(--line);border-radius:4px;font-weight:800}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}
.stat{flex:1 1 150px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-family:"Lilita One",sans-serif;font-weight:400;font-size:32px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-size:14px;font-weight:700;margin:8px 0 3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:7px 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:800;cursor:pointer;color:var(--ontxt);background:var(--leaf);border:2px solid var(--line);border-radius:10px;padding:8px 14px}
button.alt{background:var(--peach)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--eng);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pool{margin-top:14px;max-height:380px;overflow-y:auto}
.p{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--muted)}
.p .nm{flex:1;min-width:0}
.p small{color:var(--muted);display:block}
.p .x{padding:0 8px;background:none;border:none;color:var(--muted);font-size:20px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;border:2px solid var(--line);color:var(--ontxt);font-size:12px;font-weight:800}
.E{background:var(--eng)}.B{background:var(--bus)}.H{background:var(--hum)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.team{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.team header{background:var(--peach);color:var(--ontxt);border-bottom:2px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.team header b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:20px}
.cov{display:flex;gap:4px}
.cov i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent}
.cov i.on.E{background:var(--eng)}.cov i.on.B{background:var(--bus)}.cov i.on.H{background:var(--hum)}
.m{padding:9px 14px;border-top:1px dashed var(--muted)}
.m:first-of-type{border-top:none}
.m .top{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.m small{color:var(--muted)}
.tag{font-size:12px;font-weight:800;color:var(--muted)}
.foot{padding:8px 14px;border-top:2px solid var(--line);font-size:14px;font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;font-size:14px}
.sk{display:flex;flex-wrap:wrap;gap:6px}
.sc{position:relative;display:inline-block;margin:0}
.sc input{position:absolute;opacity:0;width:auto}
.sc span{display:inline-block;padding:3px 12px;border-radius:99px;border:2px solid var(--line);font-weight:800;font-size:14px;cursor:pointer;background:var(--bg)}
.sc input:checked+span{background:var(--leaf);color:var(--ontxt)}
.sc input:focus-visible+span{outline:3px solid var(--eng);outline-offset:2px}
.skt{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.skt span{font-size:11px;padding:0 7px;border-radius:99px;border:1.5px dashed var(--muted);color:var(--muted)}
.skt span.on{background:var(--leaf);color:var(--ontxt);border:1.5px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Interdisciplinary Matching Platform</h1>
  <div class="sub">Students upload interests and skills; the system sorts them into balanced teams</div>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <section class="panel">
      <h2>1. Student database</h2>
      <label for="name">Name</label>
      <input id="name" placeholder="e.g. Alex Tan">
      <label for="disc">Discipline</label>
      <select id="disc"><option value="E">Engineering</option><option value="B">Business</option><option value="H">Humanities / Communications</option></select>
      <div class="row">
        <div><label for="t1">First choice</label><select id="t1"></select></div>
        <div><label for="t2">Second choice</label><select id="t2"></select></div>
      </div>
      <label>Skills (pick any that apply)</label>
      <div class="sk" id="sk"></div>
      <small class="tag" id="hint"></small>
      <div class="btns">
        <button id="add">Add student</button>
        <button class="alt" id="sample">Load sample class</button>
        <button class="alt" id="clear">Clear</button>
      </div>
      <div class="pool" id="pool"></div>
    </section>

    <section>
      <h2>2. Sorted teams</h2>
      <div class="row" style="max-width:340px;margin-bottom:12px">
        <div><label for="size">Target team size</label>
        <select id="size"><option>3</option><option selected>4</option><option>5</option></select></div>
      </div>
      <div class="legend">
        <span><span class="chip E">Engineering</span></span>
        <span><span class="chip B">Business</span></span>
        <span><span class="chip H">Humanities / Comms</span></span>
      </div>
      <div class="teams" id="teams"></div>
    </section>
  </div>
</div>

<script>
const TRACKS=["Waste","Energy","Mobility","Circular Economy"];
const SKILLS=["Technical","Analytical","Creative","Communication","Leadership"];
const DN={E:"Engineering",B:"Business",H:"Humanities / Comms"};
const SAMPLE=[
["Aiden Lim","E","Energy","Mobility","Technical|Analytical"],["Mei Ling","E","Waste","Circular Economy","Technical|Creative"],
["Raj Menon","E","Energy","Waste","Technical|Analytical"],["Hui Min","E","Mobility","Energy","Analytical|Technical"],
["Ethan Koh","E","Circular Economy","Waste","Technical|Leadership"],["Li Ting","E","Mobility","Circular Economy","Technical|Creative"],
["Daniel Ong","B","Circular Economy","Waste","Communication|Leadership"],["Farah Aziz","B","Energy","Circular Economy","Analytical|Leadership"],
["Wei Jie","B","Mobility","Circular Economy","Analytical|Communication"],["Chloe Sim","B","Waste","Mobility","Leadership|Creative"],
["Nur Basir","B","Energy","Mobility","Analytical|Technical"],
["Priya Nair","H","Waste","Circular Economy","Communication|Analytical"],["Jun Wei","H","Mobility","Energy","Creative|Communication"],
["Sara Goh","H","Circular Economy","Waste","Communication|Leadership"],["Marcus Yeo","H","Energy","Mobility","Analytical|Communication"],
["Kai Heng","H","Waste","Energy","Creative|Technical"]
].map(a=>({n:a[0],d:a[1],t:[a[2],a[3]],s:a[4].split("|")}));
let students=SAMPLE.slice();

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
["t1","t2"].forEach((id,i)=>{$(id).innerHTML=TRACKS.map(t=>`<option>${t}</option>`).join("");$(id).selectedIndex=i});
$("sk").innerHTML=SKILLS.map(k=>`<label class="sc"><input type="checkbox" value="${k}"><span>${k}</span></label>`).join("");

function sort(list,size){
  const N=list.length; if(!N) return [];
  const T=Math.ceil(N/size), cap=Math.ceil(N/T);
  const demand={}; TRACKS.forEach(t=>demand[t]=list.filter(s=>s.t[0]===t).length+0.01);
  const cnt={}; TRACKS.forEach(t=>cnt[t]=0);
  const teams=[];
  for(let i=0;i<T;i++){
    const t=TRACKS.reduce((a,b)=>demand[b]/(cnt[b]+1)>demand[a]/(cnt[a]+1)?b:a);
    cnt[t]++; teams.push({track:t,m:[]});
  }
  const dc={E:0,B:0,H:0}; list.forEach(s=>dc[s.d]++);
  const order=list.slice().sort((a,b)=>dc[a.d]-dc[b.d]||a.n.localeCompare(b.n));
  order.forEach(s=>{
    let best=null,bs=-1e9;
    teams.forEach(tm=>{
      if(tm.m.length>=cap) return;
      const same=tm.m.filter(x=>x.d===s.d).length;
      let sc=(same===0?3:-1*same);
      if(s.t[0]===tm.track) sc+=2; else if(s.t[1]===tm.track) sc+=1;
      const have=new Set(tm.m.flatMap(x=>x.s));
      s.s.forEach(k=>{sc+=have.has(k)?-0.3:1});
      sc-=tm.m.length*0.05;
      if(sc>bs){bs=sc;best=tm}
    });
    best.m.push(s);
  });
  return teams;
}
const choice=(s,t)=>s.t[0]===t?"1st choice":s.t[1]===t?"2nd choice":"Reassigned";

function render(){
  const size=+$("size").value, teams=sort(students,size);
  $("pool").innerHTML=students.length?students.map((s,i)=>`<div class="p"><span class="chip ${s.d}">${s.d}</span><div class="nm"><b>${esc(s.n)}</b><small>${esc(s.t[0])}, then ${esc(s.t[1])}</small></div><button class="x" data-i="${i}" aria-label="Remove ${esc(s.n)}">×</button></div>`).join(""):`<div class="empty">No students yet. Add one or load the sample class.</div>`;
  let first=0,full=0,sk=0;
  teams.forEach(tm=>{sk+=new Set(tm.m.flatMap(s=>s.s)).size;tm.m.forEach(s=>{if(s.t[0]===tm.track)first++});if(new Set(tm.m.map(s=>s.d)).size===3)full++});
  const N=students.length;
  $("stats").innerHTML=[[N,"students in the database"],[teams.length,"teams formed"],[teams.length?Math.round(100*full/teams.length)+"%":"–","teams with all 3 disciplines"],[teams.length?(sk/teams.length).toFixed(1)+" / 5":"–","skills covered per team (avg)"],[N?Math.round(100*first/N)+"%":"–","placed in first-choice track"]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  $("teams").innerHTML=teams.length?teams.map((tm,i)=>{
    const ds=new Set(tm.m.map(s=>s.d)),sks=new Set(tm.m.flatMap(s=>s.s));
    return `<article class="team"><header><b>Team ${i+1}: ${esc(tm.track)}</b><span class="cov" title="Disciplines covered">${["E","B","H"].map(d=>`<i class="${d} ${ds.has(d)?"on":""}"></i>`).join("")}</span></header>`+
    tm.m.map(s=>`<div class="m"><div class="top"><span>${esc(s.n)}</span><span class="chip ${s.d}">${esc(DN[s.d])}</span></div><small>${esc(s.s.join(", "))}</small><div class="tag">${choice(s,tm.track)}</div></div>`).join("")+
    `<div class="foot">${ds.size} of 3 disciplines covered<div class="skt">${SKILLS.map(k=>`<span class="${sks.has(k)?"on":""}">${k}</span>`).join("")}</div></div></article>`}).join(""):`<div class="empty">Teams appear here as soon as students are added.</div>`;
}
$("add").onclick=()=>{
  const n=$("name").value.trim(); if(!n){$("name").focus();return}
  let t1=$("t1").value,t2=$("t2").value;
  if(t1===t2) t2=TRACKS.find(t=>t!==t1);
  const s=[...document.querySelectorAll("#sk input:checked")].map(i=>i.value);
  if(!s.length){$("hint").textContent="Pick at least one skill";return}
  $("hint").textContent="";
  students.push({n,d:$("disc").value,t:[t1,t2],s});
  $("name").value="";document.querySelectorAll("#sk input").forEach(i=>i.checked=false);render();
};
$("pool").onclick=e=>{const b=e.target.closest(".x");if(b){students.splice(+b.dataset.i,1);render()}};
$("sample").onclick=()=>{students=SAMPLE.slice();render()};
$("clear").onclick=()=>{students=[];render()};
$("size").onchange=render;
render();
</script>
</body>
</html>
